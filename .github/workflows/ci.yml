name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org/

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install --global pnpm@11.5.0

      - name: Install native test dependencies
        run: |
          brew install tmux zsh
          bash scripts/ci-install-neovim.sh "$RUNNER_TEMP/cyberdeck-nvim"
          echo "$RUNNER_TEMP/cyberdeck-nvim/bin" >> "$GITHUB_PATH"

      - name: Require native dependencies before tests
        run: node scripts/ci-native-preflight.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: |
          node --test tests/scripts/native-acceptance.test.mjs
          pnpm test

      - name: Build
        run: pnpm build

      - name: Install isolated evaluation dependencies
        run: pnpm --dir evals install --frozen-lockfile

      - name: Offline Promptfoo against isolated scripted brokers
        run: |
          pnpm exec tsc -p evals/tsconfig.json
          pnpm --dir evals run eval:offline
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
          PROMPTFOO_CONFIG_DIR: ${{ runner.temp }}/cyberdeck-promptfoo

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Packed CLI, native PTY, Lua, and isolated broker acceptance
        run: node scripts/ci-packed-acceptance.mjs
        id: packed

      - name: Upload packed acceptance evidence
        if: always() && steps.packed.outputs.evidence-root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-evidence
          path: |
            ${{ steps.packed.outputs.evidence-root }}/report.json
            ${{ steps.packed.outputs.evidence-root }}/broker-status.json
            ${{ steps.packed.outputs.evidence-root }}/broker.log

  verify-linux:
    name: verify-linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          architecture: ${{ matrix.arch }}
          registry-url: https://registry.npmjs.org/

      - name: Enable locked pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.5.0

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux zsh build-essential python3
          bash scripts/ci-install-neovim.sh "$RUNNER_TEMP/cyberdeck-nvim"
          echo "$RUNNER_TEMP/cyberdeck-nvim/bin" >> "$GITHUB_PATH"

      - name: Require native dependencies before tests
        run: node scripts/ci-native-preflight.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: |
          node --test tests/scripts/native-acceptance.test.mjs
          pnpm test

      - name: Build
        run: pnpm build

      - name: Install isolated evaluation dependencies
        run: pnpm --dir evals install --frozen-lockfile

      - name: Offline Promptfoo against isolated scripted brokers
        run: |
          pnpm exec tsc -p evals/tsconfig.json
          pnpm --dir evals run eval:offline
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
          PROMPTFOO_CONFIG_DIR: ${{ runner.temp }}/cyberdeck-promptfoo

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Packed CLI, native PTY, Lua, and isolated broker acceptance
        id: packed
        run: node scripts/ci-packed-acceptance.mjs
        env:
          CYBERDECK_NATIVE_EXPECT_ARCH: ${{ matrix.arch }}

      - name: Upload package for distro acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-package-${{ matrix.arch }}
          path: ${{ steps.packed.outputs.package-file }}
          if-no-files-found: error

      - name: Upload packed acceptance evidence
        if: always() && steps.packed.outputs.evidence-root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-${{ matrix.arch }}-evidence
          path: |
            ${{ steps.packed.outputs.evidence-root }}/report.json
            ${{ steps.packed.outputs.evidence-root }}/broker-status.json
            ${{ steps.packed.outputs.evidence-root }}/broker.log

  linux-distros:
    needs: verify-linux
    uses: ./.github/workflows/native-linux-acceptance.yml
