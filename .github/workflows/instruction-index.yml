name: Native instruction index
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: corepack enable && corepack install --global pnpm@11.5.0
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy && rustup override set 1.97.1
      - run: cargo fmt --manifest-path native/core/Cargo.toml --check && cargo clippy --locked --manifest-path native/core/Cargo.toml -- -D warnings
      - run: pnpm build && pnpm build:native
      - run: node --test tests/scripts/native-instruction-index.test.mjs
      - run: pnpm exec vitest run tests/integration/broker-recovery.test.ts tests/orchestration/instruction-queue.test.ts
        env:
          CYBERDECK_INSTRUCTION_INDEX: rust
