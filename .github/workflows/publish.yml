name: Publish npm package

run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 20
    environment: release

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Require a version tag
        id: release
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Run this workflow from a v* tag." >&2; exit 1 ;;
          esac
          package_version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$package_version"
          npm_tag="${{ inputs.npm_tag }}"
          if test -z "$npm_tag"; then
            case "$package_version" in
              *-*) npm_tag=next ;;
              *) npm_tag=latest ;;
            esac
          fi
          case "$package_version" in
            *-*) test "$npm_tag" = next || {
              echo "Prereleases must use the next dist-tag." >&2; exit 1;
            } ;;
            *) test "$npm_tag" = latest || {
              echo "Stable releases must use the latest dist-tag." >&2; exit 1;
            } ;;
          esac
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org/

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm check
          pnpm test

      - name: Publish with provenance
        run: pnpm publish --access public --tag "${{ steps.release.outputs.npm_tag }}" --provenance --no-git-checks

      - name: Verify registry publication
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          for attempt in $(seq 1 20); do
            published=$(npm view "@ishmael38/cyberdeck@$PACKAGE_VERSION" version 2>/dev/null || true)
            tagged=$(npm view "@ishmael38/cyberdeck@$NPM_TAG" version 2>/dev/null || true)
            if test "$published" = "$PACKAGE_VERSION" && test "$tagged" = "$PACKAGE_VERSION"; then
              break
            fi
            if test "$attempt" = 20; then
              echo "npm registry did not converge on $PACKAGE_VERSION under $NPM_TAG" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Clean-install published CLI
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          install_root=$(mktemp -d)
          npm install --global --prefix "$install_root" "@ishmael38/cyberdeck@$NPM_TAG"
          test "$("$install_root/bin/cyberdeck" --version)" = "$PACKAGE_VERSION"
