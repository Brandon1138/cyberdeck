name: WSL2 installation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packed-install:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install and verify inside real WSL2
        shell: pwsh
        run: ./scripts/verify-wsl-install.ps1
